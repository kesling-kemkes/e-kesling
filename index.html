<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kesling &middot; Portal Layanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122420;
    --muted:#5c6d67;
    --teal-900:#0d3f38;
    --teal-700:#0f7a68;
    --teal-500:#1ba187;
    --lime:#b9d94a;
    --amber:#e8a13a;
    --mint-50:#eef8f4;
    --mint-100:#dcf0e8;
    --line:rgba(13,63,56,0.12);
    --card-shadow: 0 30px 70px -30px rgba(13,63,56,0.28), 0 8px 24px -12px rgba(13,63,56,0.16);
    --tile-border: rgba(66,80,76,0.32);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:24px;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0.22), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(6,44,50,0.28), transparent 55%),
      linear-gradient(160deg, #1fd8e4 0%, #05bacc 45%, #048fa0 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------------------------------------------------------------
     Latar ambient: tiga blob gradien besar yang mengambang perlahan
     -- identik dengan tampilan yang sudah ada agar kedua halaman
     terasa satu kesatuan.
  --------------------------------------------------------------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    will-change:transform;
  }
  .blob-1{
    width:560px;height:560px;
    top:-180px;left:-160px;
    background:radial-gradient(circle at 35% 35%, #9fe6d1, transparent 70%);
    animation:drift1 16s ease-in-out infinite;
  }
  .blob-2{
    width:520px;height:520px;
    bottom:-200px;right:-160px;
    background:radial-gradient(circle at 60% 40%, #fbdca0, transparent 70%);
    animation:drift2 19s ease-in-out infinite;
  }
  .blob-3{
    width:380px;height:380px;
    top:38%;left:58%;
    background:radial-gradient(circle at 50% 50%, #d9f0a0, transparent 72%);
    opacity:0.4;
    animation:drift3 14s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(40px,30px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-35px,-25px) scale(1.06); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-20px,25px) scale(0.94); }
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:900px;
  }

  /* ---------------------------------------------------------------
     HALAMAN PEMILIHAN (landing) -- logo + tiga kartu pilihan

     CATATAN PENTING soal animasi masuk:
     Sebelumnya elemen ini memakai `animation: riseIn ... both` yang
     berjalan otomatis begitu CSS diparse. Masalahnya, waktu animasi
     CSS dihitung sejak dokumen mulai dimuat -- bukan sejak halaman
     benar-benar tampil di layar. Karena stylesheet Google Fonts di
     <head> bersifat render-blocking, pada kunjungan pertama (belum
     ada cache font) waktu unduh font ikut "memakan" durasi animasi
     di belakang layar, sehingga begitu halaman akhirnya dicat,
     animasinya sudah kelar duluan -- kesannya muncul tiba-tiba.
     Saat refresh, font sudah tersimpan di cache browser sehingga
     render lebih cepat dan animasi sempat terlihat.

     Perbaikannya: elemen ini dimulai dalam kondisi "sebelum animasi"
     (opacity:0, sedikit turun) lewat CSS transition biasa, lalu kelas
     .page-ready ditambahkan oleh JavaScript setelah frame pertama
     benar-benar tercat (lihat skrip di bagian bawah). Dengan begitu
     animasi selalu terpicu dari titik ketika pengguna sungguh melihat
     halamannya, terlepas dari cepat/lambatnya jaringan.
  --------------------------------------------------------------- */
  #landing{
    text-align:center;
    opacity:0;
    transform:translateY(18px) scale(.98);
    transition:opacity .7s cubic-bezier(.19,1,.22,1), transform .7s cubic-bezier(.19,1,.22,1);
  }
  #landing.page-ready{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  #landing.leaving{
    opacity:0;
    transform:translateY(-10px) scale(.98);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }

  .logo-wrap{
    display:flex;
    justify-content:center;
    margin:0 0 40px;
  }
  .logo-wrap img{
    height:64px;
    width:auto;
    display:block;
  }
  .logo-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
    border-radius:999px;
    padding:14px 34px;
    box-shadow:var(--card-shadow);
  }
  .logo-pill img{
    height:48px;
    width:auto;
    display:block;
  }

  .tiles{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:22px;
    margin:0 0 8px;
  }

  .top-bar{
    text-align:left;
  }

  .login-pill-btn{
    display:none;
  }

  .swipe-hint{
    display:none;
  }

  .tile{
    position:relative;
    width:236px;
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1.5px solid var(--tile-border);
    border-radius:26px;
    box-shadow:var(--card-shadow);
    overflow:hidden;
    cursor:pointer;
    text-align:center;
    display:flex;
    flex-direction:column;
    transition:transform .3s cubic-bezier(.19,1,.22,1), box-shadow .3s ease;
    -webkit-tap-highlight-color:transparent;
    opacity:0;
    animation:tileIn .6s cubic-bezier(.19,1,.22,1) both;
  }
  /* Kartu muncul satu-persatu (staggered) saat halaman pemilihan dibuka,
     supaya perpindahan terasa lebih halus dibanding muncul serentak. */
  .tile:nth-child(1){ animation-delay:.12s; }
  .tile:nth-child(2){ animation-delay:.22s; }
  .tile:nth-child(3){ animation-delay:.32s; }
  @keyframes tileIn{
    from{ opacity:0; transform:translateY(22px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .tile:hover, .tile:focus-visible{
    transform:translateY(-6px);
    box-shadow:0 40px 80px -30px rgba(13,63,56,0.32), 0 10px 28px -12px rgba(13,63,56,0.2);
    outline:none;
  }
  .tile:active{ transform:translateY(-2px); }

  /* Warna border tiap kartu disamakan dengan warna latar area ikonnya
     supaya kartu & ikon terasa satu kesatuan warna. */
  .tile-mint{ border-color:#bfe4d5; --title-color:var(--teal-700); }
  .tile-blue{ border-color:#b9d7f2; --title-color:#1f6fb2; }
  .tile-red{ border-color:#f3c2bc; --title-color:#c1443a; }

  .tile-icon{
    padding:60px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Setiap tema ikon punya set variabel warna sendiri (--icon-line,
     --icon-accent, --icon-fill, --icon-soft) sehingga garis & aksen SVG
     di dalamnya otomatis selaras dengan warna latar kartunya. */
  .tile-icon.icon-mint{
    background:linear-gradient(160deg, #eef8f4, #d3ecdf);
    --icon-line:var(--teal-700);
    --icon-accent:var(--teal-500);
    --icon-soft:var(--mint-100);
    --icon-fill:#ffffff;
  }
  .tile-icon.icon-amber{
    background:linear-gradient(160deg, #fff6e6, #fbe4bd);
    --icon-line:#a86a17;
    --icon-accent:var(--amber);
    --icon-soft:#fbe4bd;
    --icon-fill:#ffffff;
  }
  .tile-icon.icon-lime{
    background:linear-gradient(160deg, #f6faea, #e4efb8);
    --icon-line:#5f7a1f;
    --icon-accent:var(--lime);
    --icon-soft:#e4efb8;
    --icon-fill:#ffffff;
  }
  .tile-icon.icon-blue{
    background:linear-gradient(160deg, #eaf3fc, #c9e1f7);
    --icon-line:#1f6fb2;
    --icon-accent:#4fa3e3;
    --icon-soft:#c9e1f7;
    --icon-fill:#ffffff;
  }
  .tile-icon.icon-red{
    background:linear-gradient(160deg, #fdecea, #f6c6c0);
    --icon-line:#c1443a;
    --icon-accent:#e8776d;
    --icon-soft:#f6c6c0;
    --icon-fill:#ffffff;
  }
  .tile-icon svg{
    width:92px;
    height:92px;
    transition:transform .35s cubic-bezier(.19,1,.22,1);
  }
  .tile:hover .tile-icon svg, .tile:focus-visible .tile-icon svg{
    transform:scale(1.06) translateY(-2px);
  }

  /* Body kartu: judul ditempatkan tepat di bawah garis batas area ikon
     (bagian atas), sementara label Publik/Khusus Pegawai ditempatkan
     tepat di atas batas bawah kartu -- keduanya tetap sejajar antar
     kartu karena tinggi body kartu disamakan (min-height). */
  .tile-body{
    padding:14px 16px 18px;
    border-top:1px solid var(--line);
    background:#ffffff;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:150px;
  }
  /* Judul kartu: PENGATURAN TETAP -- jangan diubah pada perbaikan berikutnya.
     .tile-title-wrap membuat judul turun ke bawah dan align middle (center
     secara vertikal & horizontal) di ruang antara ikon dan label badge. */
  .tile-title-wrap{
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile-title{
    font-size:1.46rem;
    font-weight:800;
    color:var(--title-color, var(--teal-900));
    line-height:1.2;
    margin:0;
    text-align:center;
  }
  .tile-badge{
    margin-top:auto;
    font-size:0.8rem;
    font-weight:800;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:rgba(18,36,32,0.38);
  }

  .page-brandline{
    margin-top:36px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:#ffffff;
  }

  /* ---------------------------------------------------------------
     KARTU PROSES -- persis tampilan yang sudah ada sebelumnya,
     ditampilkan setelah area kartu (Pusat Data dan Dokumen / Informasi Kegiatan / Masuk) diklik.
  --------------------------------------------------------------- */
  .hidden{ display:none !important; }

  #processView{
    /* flex + min-height sendiri supaya kartu proses selalu berada di
       tengah layar (horizontal & vertikal), tidak tergantung pada
       align-items body -- termasuk saat body diubah ke flex-start
       khusus untuk tata letak #landing pada layar kecil. */
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:calc(100vh - 48px);
    min-height:calc(100dvh - 48px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #processView.leaving{
    opacity:0;
    transform:translateY(-10px) scale(.98);
    pointer-events:none;
  }
  .card{
    position:relative;
    width:100%;
    max-width:293px;
    margin:0 auto;
    text-align:center;
    background:#ffffff;
    border:1px solid rgba(255,255,255,0.6);
    border-radius:28px;
    box-shadow:var(--card-shadow);
    padding:40px 40px 88px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:380px;
    animation:riseIn .7s cubic-bezier(.19,1,.22,1) both;
    transition:transform .35s cubic-bezier(.19,1,.22,1), box-shadow .35s ease;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(18px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 40px 80px -30px rgba(13,63,56,0.32), 0 10px 28px -12px rgba(13,63,56,0.2);
  }

  /* Angka persentase progres -- tampil besar & tegas, lalu melebur
     (fade + collapse) begitu mencapai 100% dan digantikan animasi
     berhasil. */
  /* Angka persentase ditonjolkan dengan gradasi warna brand, tanda
     "%" dibuat lebih kecil (lewat .pct-sign yang disisipkan JS), dan
     kilau halus yang berdenyut selama proses berjalan supaya terasa
     lebih hidup dibanding angka polos berwarna tunggal. */
  p.desc{
    font-size:2.4rem;
    font-weight:800;
    line-height:1.2;
    background:linear-gradient(135deg, var(--teal-700), var(--teal-500) 55%, var(--lime));
    -webkit-background-clip:text;
    background-clip:text;
    color:var(--teal-900);
    -webkit-text-fill-color:transparent;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    margin:0 auto 10px;
    max-height:64px;
    overflow:hidden;
    animation:pctGlow 1.7s ease-in-out infinite;
    transition:opacity .4s ease, max-height .4s ease, margin .4s ease, transform .4s ease;
  }
  .pct-sign{
    font-size:0.5em;
    font-weight:700;
    margin-left:2px;
    opacity:.8;
    /* p.desc memakai background-clip:text (gradient) sehingga warna
       teks aslinya transparan lewat -webkit-text-fill-color; tanpa
       baris di bawah, "%" ikut mewarisi nilai transparan itu padahal
       span ini tidak punya background sendiri untuk "diintip" --
       akibatnya tanda persen jadi tidak terlihat sama sekali. */
    color:var(--teal-700);
    -webkit-text-fill-color:currentColor;
  }
  @keyframes pctGlow{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(27,161,135,0)); }
    50%{ filter:drop-shadow(0 3px 12px rgba(27,161,135,.4)); }
  }
  p.desc.done{
    opacity:0;
    max-height:0;
    margin-bottom:0;
    transform:translateY(-8px) scale(.92);
    animation:none;
  }

  /* Kotak ini menampung bar proses (ramping) lalu tumbuh halus
     menampung lencana berhasil begitu progres selesai -- diberi
     class "grown" lewat JS supaya transisi tingginya mulus. */
  .progress-wrap{
    position:relative;
    margin:0;
    min-height:34px;
    display:flex;
    align-items:center;
    transition:min-height .4s cubic-bezier(.19,1,.22,1);
  }
  .progress-wrap.grown{
    min-height:205px;
  }
  .rail{
    position:relative;
    width:100%;
    height:6px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
    transition:opacity .3s ease;
  }
  .rail-fill{
    position:absolute;
    top:0; left:0;
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--teal-500), var(--lime) 55%, var(--amber));
    background-size:200% 100%;
    animation:sheen 2.4s linear infinite;
  }
  @keyframes sheen{
    0%{ background-position:0% 0; }
    100%{ background-position:200% 0; }
  }

  /* Tampilan sukses -- menggantikan bar begitu progres genap 100%,
     didesain sebagai lencana (badge) sederhana: latar melingkar lembut
     berisi tanda centang besar yang "digambar" -- tanpa cincin pulse
     dan tanpa lingkaran outline di sekeliling centang. */
  .success-mark{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    opacity:0;
    transform:translateY(8px) scale(.9);
    pointer-events:none;
    transition:opacity .4s ease, transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .success-mark.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .success-badge{
    position:relative;
    width:117px;height:117px;
    flex:0 0 auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--mint-100);
    border:1.5px solid rgba(27,161,135,.2);
    box-shadow:none;
  }
  .success-badge svg{
    width:76px;height:76px;
    flex:0 0 auto;
  }
  .success-check{
    stroke:var(--teal-500);
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:49;
    stroke-dashoffset:49;
  }
  .success-mark.show .success-check{
    animation:drawCheck .3s ease .1s forwards;
  }
  @keyframes drawCheck{
    to{ stroke-dashoffset:0; }
  }
  /* Teks status kini tampil sebagai teks polos (tanpa latar pill) --
     huruf normal (bukan kapital), dengan tiga titik yang muncul
     bertahap (lihat .success-text .dot di bawah). */
  .success-text{
    display:inline-flex;
    align-items:center;
    font-size:0.9rem;
    font-weight:800;
    color:var(--teal-700);
    letter-spacing:0.01em;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .35s ease .4s, transform .35s ease .4s;
  }
  .success-mark.show .success-text{
    opacity:1;
    transform:translateY(0);
  }
  .success-text .dot{
    opacity:0;
  }
  .success-mark.show .success-text .dot{
    animation:dotFade .25s ease forwards;
  }
  .success-mark.show .success-text .dot:nth-child(1){ animation-delay:.55s; }
  .success-mark.show .success-text .dot:nth-child(2){ animation-delay:.75s; }
  .success-mark.show .success-text .dot:nth-child(3){ animation-delay:.95s; }
  @keyframes dotFade{
    to{ opacity:1; }
  }

  /* Tombol Kembali tanpa bentuk pill -- teks polos + panah, tetap
     menempel di sudut kanan-bawah kartu (position:absolute terhadap
     .card), garis bawah muncul saat hover sebagai penanda interaktif. */
  .back-link{
    position:absolute;
    right:24px;
    bottom:24px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 2px;
    font-size:0.8rem;
    font-weight:700;
    color:var(--teal-700);
    background:none;
    border:none;
    text-decoration:none;
    cursor:pointer;
    transition:color .2s ease, transform .2s ease;
  }
  .back-link:hover{
    color:var(--teal-900);
    transform:translateX(-2px);
  }

  @media (max-width:680px){
    body{
      align-items:flex-start;
      padding:16px 22px;
    }
    .page{ max-width:none; }

    /* Halaman pemilihan diubah jadi kolom setinggi layar: header berisi
       logo (kiri atas) & tombol Login (kanan atas) selalu terlihat penuh,
       dua kartu publik diletakkan di tengah layar (bukan menempel header),
       dan brandline dipatri di tengah-bawah layar sebagai footer. */
    #landing{
      display:flex;
      flex-direction:column;
      position:relative;
      min-height:calc(100vh - 32px);
      min-height:calc(100dvh - 32px);
      padding-bottom:34px;
    }

    /* Header: logo Kesling kiri atas + tombol pill Login kanan atas,
       sejajar dalam satu baris. */
    .top-bar{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:0 0 20px;
    }
    .top-bar .logo-wrap{
      flex:0 0 auto;
      margin:0;
      justify-content:flex-start;
    }
    .top-bar .logo-pill{
      padding:8px 16px;
    }
    .top-bar .logo-pill img{ height:28px; }

    /* Tombol Masuk berbentuk pill, memakai tema warna lime (basis
       #cddc29) -- menggantikan kartu Masuk yang sebelumnya terpotong
       di layar sempit. */
    .login-pill-btn{
      display:inline-flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      background:linear-gradient(160deg, #f8fbe6, #e4edae);
      border:1px solid #d7e28f;
      border-radius:999px;
      padding:10px 20px 10px 14px;
      box-shadow:none;
      color:#5f6b12;
      font-family:inherit;
      font-weight:800;
      font-size:0.78rem;
      letter-spacing:0.01em;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:transform .3s cubic-bezier(.19,1,.22,1), filter .3s ease;
    }
    .login-pill-btn svg{ width:17px; height:17px; flex:0 0 auto; }
    .login-pill-btn:hover, .login-pill-btn:active{
      transform:translateY(-2px);
      filter:brightness(1.06);
      box-shadow:none;
    }
    .login-pill-btn:active{ transform:translateY(0); }

    /* Kartu Pusat Data dan Dokumen & Informasi Kegiatan disandingkan 2 kolom dan
       dirampingkan; kartu Login disembunyikan karena sudah diwakili
       tombol pada header. Margin atas & bawah otomatis membuat kartu
       jatuh di tengah ruang layar, bukan menempel ke header. */
    .tiles{
      flex:0 0 auto;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin:auto 0;
    }
    .tile{ width:auto; }
    .tile-login{ display:none; }
    .tile-icon{ padding:30px 12px; }
    .tile-icon svg{ width:58px; height:58px; }
    .tile-body{ min-height:120px; padding:12px 12px 16px; }
    /* Judul kartu satu baris jika kartu masih cukup lebar; begitu
       kartu menyempit dan teks mepet ke sisi kartu, judul otomatis
       turun ke dua baris (tanpa white-space:nowrap, browser yang
       menentukan titik pemenggalan sesuai lebar kartu). <br> asli
       di dalam judul tetap disembunyikan lewat .tile-break supaya
       tidak memaksa baris kedua padahal ruang masih cukup. */
    .tile-title{ font-size:1.04rem; }
    .tile-break{ display:none; }
    .tile-badge{ font-size:0.73rem; }

    /* Brandline dipatri di tengah-bawah layar sebagai footer,
       lepas dari alur flex supaya kartu bisa benar-benar di tengah. */
    .page-brandline{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      margin-top:0;
    }

    .card{ padding:36px 22px 80px; min-height:320px; border-radius:22px; }
    .back-link{ right:18px; bottom:18px; }
    #processView{
      min-height:calc(100vh - 32px);
      min-height:calc(100dvh - 32px);
    }
  }
</style>

              <rect x="24" y="23" width="6" height="6" rx="1.4" fill="var(--icon-accent)" opacity="0.6"/>
              <rect x="14" y="31" width="6" height="4" rx="1.2" fill="var(--icon-accent)" opacity="0.85"/>
            </svg>
          </div>
          <div class="tile-body">
            <div class="tile-title-wrap"><p class="tile-title">Informasi<br class="tile-break"> Kegiatan</p></div>
            <p class="tile-badge">Publik</p>
          </div>
        </div>

        <!-- Kartu 3: Login (Khusus Pegawai) -->
        <!-- Catatan: ikon di bawah ini adalah placeholder visual untuk kartu Login, sesuaikan bila tersedia aset resmi -->
        <div class="tile tile-login tile-red" role="button" tabindex="0" aria-label="Masuk sebagai pegawai Kesling"
             onclick="startRedirect('login')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();startRedirect('login');}">
          <div class="tile-icon icon-red">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="17" r="8" fill="var(--icon-fill)" stroke="var(--icon-line)" stroke-width="2.4"/>
              <path d="M9 40C9 31.7 15.6 25 24 25C32.4 25 39 31.7 39 40" fill="var(--icon-soft)" stroke="var(--icon-line)" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M30 21L36 21M36 21L33.6 18.6M36 21L33.6 23.4" stroke="var(--icon-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="tile-body">
            <div class="tile-title-wrap"><p class="tile-title">e-Kesling</p></div>
            <p class="tile-badge">Khusus Pegawai</p>
          </div>
        </div>

      </div>

      <p class="page-brandline">Direktorat Kesehatan Lingkungan</p>
    </div>

    <!-- ===================== KARTU PROSES (tampilan lama) ===================== -->
    <div id="processView" class="hidden">
      <div class="card">
        <a class="back-link" role="button" tabindex="0" onclick="cancelRedirect()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cancelRedirect();}">&larr; Kembali</a>

        <p class="desc" id="processDesc" aria-live="polite">0<span class="pct-sign">%</span></p>

        <div class="progress-wrap" id="progressWrap">
          <div class="rail" id="rail" role="progressbar" aria-label="Memuat aplikasi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="rail-fill" id="railFill"></div>
          </div>
          <div class="success-mark" id="successMark" aria-hidden="true">
          <span class="success-badge">
            <svg viewBox="0 0 52 52">
              <path class="success-check" fill="none" d="M9 27 L20 39 L43 16"/>
            </svg>
          </span>
          <span class="success-text">Membuka halaman<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>
        </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function(){
      /* ---------------------------------------------------------------
         Konfigurasi tujuan tiap kartu.
         - "login" memakai tautan aplikasi Kesling yang sudah ada
           (dipindahkan dari redirect otomatis versi sebelumnya).
         - "portal" dan "kegiatan" BELUM memiliki tautan resmi.
           Catatan: ganti nilai url di bawah ini dengan tautan final
           Pusat Data dan Dokumen dan Informasi Kegiatan begitu tersedia.
      --------------------------------------------------------------- */
      var TARGETS = {
        portal: {
          // TODO catatan: tautan Pusat Data dan Dokumen akan ditambahkan nanti
          url: '',
          desc: 'Mohon tunggu sebentar...',
          label: 'Pusat Data dan Dokumen'
        },
        kegiatan: {
          // TODO catatan: tautan Informasi Kegiatan akan ditambahkan nanti
          url: '',
          desc: 'Mohon tunggu sebentar...',
          label: 'Informasi Kegiatan'
        },
        login: {
          url: 'https://script.google.com/macros/s/AKfycbwOih--EQqMIGkAHLnzZ7uIUAaei7M7PJMBLKtZQ0hGE-SJ23-THClSVKpUeyoAApAuHA/exec',
          desc: 'Mohon tunggu sebentar...',
          label: 'Masuk Pegawai'
        }
      };

      var landing = document.getElementById('landing');

      // Picu transisi "muncul" halaman landing setelah frame pertama
      // benar-benar tercat, bukan mengandalkan CSS animation yang
      // waktunya bisa "termakan" oleh keterlambatan pemuatan resource
      // (mis. font Google Fonts) pada kunjungan pertama. Dua lapis
      // requestAnimationFrame memastikan browser sudah melukis kondisi
      // awal (opacity:0) sebelum kita pindah ke kondisi akhir, supaya
      // transisinya selalu terlihat berjalan.
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if (landing) landing.classList.add('page-ready');
        });
      });

      var processView = document.getElementById('processView');
      var processDesc = document.getElementById('processDesc');
      var fallbackLink = document.getElementById('fallbackLink');
      var fallback = document.getElementById('fallback');

      var railFill = document.getElementById('railFill');
      var rail = document.getElementById('rail');
      var progressWrap = document.getElementById('progressWrap');
      var stepsFill = document.getElementById('stepsFill');
      var successMark = document.getElementById('successMark');
      var stepEls = document.querySelectorAll('#steps .step');

      var current = null;
      var rafId = null;
      var timers = [];

      function setStep(index, state){
        var el = stepEls[index];
        if (!el) return;
        el.classList.remove('active', 'done');
        if (state) el.classList.add(state);
      }

      function clearTimers(){
        timers.forEach(function(t){ clearTimeout(t); });
        timers = [];
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      }

      function resetProgress(){
        clearTimers();
        if (railFill) { railFill.style.transition = 'none'; railFill.style.width = '0%'; }
        if (stepsFill) { stepsFill.style.transition = 'none'; stepsFill.style.width = '0%'; }
        if (rail) { rail.style.opacity = '1'; rail.setAttribute('aria-valuenow', '0'); }
        if (progressWrap) progressWrap.classList.remove('grown');
        if (successMark) successMark.classList.remove('show');
        if (processDesc) {
          processDesc.classList.remove('done');
          processDesc.innerHTML = '0<span class="pct-sign">%</span>';
        }
        setStep(0, null); setStep(1, null); setStep(2, null);
        // paksa reflow supaya transisi berikutnya benar-benar terpicu ulang
        if (railFill) void railFill.offsetWidth;
      }

      function goToUrl(){
        if (!current || !current.url) {
          // Tautan belum tersedia -- tetap di kartu proses tanpa redirect otomatis
          return;
        }
        window.location.assign(current.url);
      }

      function runProgress(){
        var DURATION = 1700;
        var HOLD_AFTER_SUCCESS = 1000;
        var start = null;

        function frame(ts){
          if (start === null) start = ts;
          var elapsed = ts - start;
          var pct = Math.min(100, (elapsed / DURATION) * 100);
          var eased = 1 - Math.pow(1 - pct / 100, 3);
          var shown = Math.round(eased * 100);

          if (railFill) railFill.style.width = shown + '%';
          if (stepsFill) stepsFill.style.width = shown + '%';
          if (rail) rail.setAttribute('aria-valuenow', String(shown));
          if (processDesc) processDesc.innerHTML = shown + '<span class="pct-sign">%</span>';

          if (shown < 34) {
            setStep(0, 'active'); setStep(1, null); setStep(2, null);
          } else if (shown < 72) {
            setStep(0, 'done'); setStep(1, 'active'); setStep(2, null);
          } else if (shown < 100) {
            setStep(0, 'done'); setStep(1, 'done'); setStep(2, 'active');
          } else {
            setStep(0, 'done'); setStep(1, 'done'); setStep(2, 'done');
          }

          if (pct < 100) {
            rafId = requestAnimationFrame(frame);
          } else {
            onProgressComplete();
          }
        }

        function onProgressComplete(){
          if (processDesc) processDesc.innerHTML = '100<span class="pct-sign">%</span>';
          if (rail) rail.style.opacity = '0';
          if (processDesc) processDesc.classList.add('done');
          if (progressWrap) progressWrap.classList.add('grown');
          if (successMark) successMark.classList.add('show');
          timers.push(setTimeout(goToUrl, HOLD_AFTER_SUCCESS));
        }

        setStep(0, 'active');
        rafId = requestAnimationFrame(frame);
      }

      window.startRedirect = function(key){
        current = TARGETS[key];
        if (!current) return;

        if (fallbackLink) {
          fallbackLink.textContent = 'Buka ' + current.label;
          fallbackLink.href = current.url || '#';
        }
        if (fallback) fallback.style.display = current.url ? 'block' : 'none';

        landing.classList.add('leaving');
        timers.push(setTimeout(function(){
          landing.classList.add('hidden');
          processView.classList.remove('hidden');
          resetProgress();
          runProgress();
        }, 260));
      };

      window.cancelRedirect = function(){
        clearTimers();
        processView.classList.add('leaving');
        timers.push(setTimeout(function(){
          processView.classList.add('hidden');
          processView.classList.remove('leaving');
          landing.classList.remove('hidden');
          landing.classList.remove('leaving');
        }, 260));
      };
    })();
  </script>
</body>
</html>
