<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwOih--EQqMIGkAHLnzZ7uIUAaei7M7PJMBLKtZQ0hGE-SJ23-THClSVKpUeyoAApAuHA/exec">
<link rel="canonical" href="https://script.google.com/macros/s/AKfycbwOih--EQqMIGkAHLnzZ7uIUAaei7M7PJMBLKtZQ0hGE-SJ23-THClSVKpUeyoAApAuHA/exec">
<title>Kesling &middot; Sistem Jadwal Aktivitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152622;
    --muted:#5c6d67;
    --teal-900:#0d3f38;
    --teal-700:#116358;
    --teal-500:#14876f;
    --amber:#e8a13a;
    --mint-50:#eaf6f1;
    --mint-100:#dcf0e8;
    --line:rgba(13,63,56,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 12% -10%, #d8f0e6 0%, transparent 55%),
      radial-gradient(900px 560px at 108% 10%, #fbead0 0%, transparent 50%),
      linear-gradient(160deg, var(--mint-50) 0%, #f6f7ef 55%, var(--mint-100) 100%);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:420px;
    text-align:center;
  }

  /* Mark: dua daun saling melingkar -- motif kesehatan lingkungan,
     dipakai konsisten dgn ikon di halaman login. Dianimasikan halus
     spt "bernapas" supaya terasa hidup tanpa berlebihan. */
  .mark{
    width:64px;
    height:64px;
    margin:0 auto 28px;
    position:relative;
  }
  .mark svg{
    width:100%;
    height:100%;
    display:block;
    filter:drop-shadow(0 10px 18px rgba(13,63,56,0.18));
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.045);}
  }

  .eyebrow{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal-700);
    margin:0 0 10px;
  }

  h1{
    font-size:1.4rem;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 10px;
    color:var(--teal-900);
  }

  p.desc{
    font-size:0.95rem;
    line-height:1.55;
    color:var(--muted);
    margin:0 auto 30px;
    max-width:320px;
  }

  /* Signature element: progress rail dgn segmen bergerak, meniru
     status "menyiapkan data" tanpa perlu klaim persentase palsu. */
  .rail{
    position:relative;
    width:min(280px, 70vw);
    height:5px;
    margin:0 auto 34px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .rail::after{
    content:"";
    position:absolute;
    top:0; left:0;
    height:100%;
    width:38%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--teal-500), var(--amber));
    animation:slide 1.35s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes slide{
    0%{ left:-40%; }
    100%{ left:100%; }
  }

  .fallback{
    font-size:0.82rem;
    color:var(--muted);
  }
  .fallback a{
    color:var(--teal-700);
    font-weight:700;
    text-decoration:none;
    border-bottom:1.5px solid transparent;
    transition:border-color .15s ease;
  }
  .fallback a:hover{ border-color:var(--teal-700); }

  .brandline{
    margin-top:46px;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(21,38,34,0.38);
  }

  @media (prefers-reduced-motion: reduce){
    .mark svg, .rail::after{ animation:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="4" y1="8" x2="52" y2="52" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1ba187"/>
            <stop offset="1" stop-color="#0d5b4f"/>
          </linearGradient>
          <linearGradient id="g2" x1="18" y1="16" x2="60" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f3c26a"/>
            <stop offset="1" stop-color="#e08a2b"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="31" fill="#ffffff"/>
        <path d="M32 10c11 3 18 12 18 22 0 5-2 9-6 9-8 0-13-8-13-17 0-6 1-10 1-14z" fill="url(#g1)"/>
        <path d="M32 54c-11-3-18-12-18-22 0-5 2-9 6-9 8 0 13 8 13 17 0 6-1 10-1 14z" fill="url(#g2)"/>
      </svg>
    </div>

    <p class="eyebrow">Kesling &middot; Direktorat Kesehatan Lingkungan</p>
    <h1>Menyiapkan Sistem Jadwal Aktivitas</h1>
    <p class="desc">Mohon tunggu sebentar, halaman aplikasi akan segera ditampilkan.</p>

    <div class="rail" role="progressbar" aria-label="Memuat aplikasi"></div>

    <p class="fallback">
      Belum terbuka otomatis?
      <a href="https://script.google.com/macros/s/AKfycbwOih--EQqMIGkAHLnzZ7uIUAaei7M7PJMBLKtZQ0hGE-SJ23-THClSVKpUeyoAApAuHA/exec">Buka aplikasi</a>
    </p>

    <p class="brandline">Sistem Internal &bull; Kementerian Kesehatan RI</p>
  </div>

  <script>
    window.location.replace('https://script.google.com/macros/s/AKfycbwOih--EQqMIGkAHLnzZ7uIUAaei7M7PJMBLKtZQ0hGE-SJ23-THClSVKpUeyoAApAuHA/exec');
  </script>
</body>
</html>
